name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            PROJECT_PATH="/var/www/MedBook"

            echo "===================================="
            echo "🚀 Starting deployment..."
            echo "===================================="

            echo "📂 Opening project..."
            cd "$PROJECT_PATH"

            echo "📥 Fetching latest code..."
            git fetch origin

            echo "🔄 Resetting to latest commit..."
            git reset --hard origin/main

            echo "🐍 Detecting virtual environment..."
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d ".venv" ]; then
              source .venv/bin/activate
            elif [ -d "env" ]; then
              source env/bin/activate
            else
              echo "❌ Virtual environment not found!"
              exit 1
            fi

            echo "📦 Installing dependencies..."
            pip install -r requirements.txt

            echo "🧹 Running Django system checks..."
            python manage.py check

            echo "🗄 Applying migrations..."
            python manage.py migrate --noinput

            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput

            echo "🤖 Registering Telegram bot commands..."
            python manage.py set_bot_commands || true

            # ── Restart services ─────────────────────────────────────────────

            restart_service() {
              local SVC="$1"
              local LABEL="$2"
              if sudo systemctl list-unit-files "${SVC}.service" | grep -q "${SVC}"; then
                echo "🔄 Restarting ${LABEL}..."
                sudo systemctl restart "${SVC}"
                sleep 2
                if sudo systemctl is-active --quiet "${SVC}"; then
                  echo "✅ ${LABEL} — ishlayapti"
                else
                  echo "⚠️  ${LABEL} — ishga tushmadi, log:"
                  sudo journalctl -u "${SVC}" -n 10 --no-pager || true
                fi
              else
                echo "ℹ️  ${LABEL} service topilmadi (${SVC}) — o'tkazib yuborildi."
              fi
            }

            restart_service "book"              "Gunicorn"
            restart_service "medbook-celery"    "Celery Worker"
            restart_service "medbook-celerybeat" "Celery Beat"

            # ── Final check ──────────────────────────────────────────────────

            echo "🩺 Checking main service status..."
            sudo systemctl is-active --quiet book

            echo "===================================="
            echo "✅ Deployment completed successfully!"
            echo "Current commit: $(git rev-parse --short HEAD)"
            echo "===================================="