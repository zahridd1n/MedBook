<style>
:root { --brand: {{ business.primary_color|default:'#6366f1' }}; --brand-dark: color-mix(in srgb, var(--brand) 80%, #000); --brand-light: color-mix(in srgb, var(--brand) 12%, #fff); }

/* ── Dark variant (over dark hero) ── */
.nav-mod.nav-dark:not(.scrolled) .nav-mod-inner {
  background: rgba(10, 15, 30, 0.38);
  backdrop-filter: blur(32px) saturate(140%);
  -webkit-backdrop-filter: blur(32px) saturate(140%);
  border-color: rgba(255,255,255,0.1);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.nav-mod.nav-dark:not(.scrolled) .nav-mod-brand-name { color: rgba(255,255,255,0.92); }
.nav-mod.nav-dark:not(.scrolled) .nav-mod-link { color: rgba(255,255,255,0.6); }
.nav-mod.nav-dark:not(.scrolled) .nav-mod-link:hover { color: #fff; }
.nav-mod.nav-dark:not(.scrolled) .nav-mod-link-bg { background: rgba(255,255,255,0.08); }
.nav-mod.nav-dark:not(.scrolled) .nav-mod-hamburger span,
.nav-mod.nav-dark:not(.scrolled) .nav-mod-hamburger span::before,
.nav-mod.nav-dark:not(.scrolled) .nav-mod-hamburger span::after { background: rgba(255,255,255,0.75); }

/* ── Modern Creative ── */
@keyframes blobFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(20px, -30px) scale(1.05); }
  50% { transform: translate(-10px, 20px) scale(0.95); }
  75% { transform: translate(30px, 10px) scale(1.02); }
}

.nav-mod {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999;
  pointer-events: none;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-mod.hidden { transform: translateY(-100%); }
.nav-mod-inner {
  pointer-events: auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  padding: 0 24px;
  max-width: 1200px;
  margin: 16px auto 0;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-radius: 100px;
  border: 1px solid rgba(226,232,240,0.5);
  box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-mod.scrolled .nav-mod-inner {
  height: 56px;
  padding: 0 16px;
  margin-top: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
}

/* Blobs */
.nav-mod-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.25;
  pointer-events: none;
  animation: blobFloat 12s ease-in-out infinite;
}
.nav-mod-blob-1 {
  width: 200px; height: 200px;
  background: var(--brand);
  top: -80px; left: -60px;
  opacity: 0.15;
}
.nav-mod-blob-2 {
  width: 160px; height: 160px;
  background: #8b5cf6;
  bottom: -60px; right: -40px;
  opacity: 0.1;
  animation-delay: -4s;
  animation-duration: 15s;
}
.nav-mod-blob-3 {
  width: 120px; height: 120px;
  background: #ec4899;
  top: -40px; right: 30%;
  opacity: 0.08;
  animation-delay: -8s;
  animation-duration: 10s;
}

/* Brand */
.nav-mod-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  padding: 4px 14px 4px 4px;
  border-radius: 100px;
  transition: all 0.3s;
  position: relative;
  z-index: 2;
}
.nav-mod-brand:hover { background: rgba(0,0,0,0.03); }
.nav-mod-brand-logo {
  height: 34px;
  width: auto;
  border-radius: 100px;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-mod.scrolled .nav-mod-brand-logo {
  height: 28px;
}
.nav-mod-brand-name {
  font-size: 15px;
  font-weight: 700;
  color: #0f172a;
  letter-spacing: -0.03em;
  transition: font-size 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-mod.scrolled .nav-mod-brand-name {
  font-size: 13px;
}

/* Links as floating pills */
.nav-mod-links {
  display: flex;
  align-items: center;
  gap: 4px;
  list-style: none;
  margin: 0;
  padding: 0;
  position: relative;
  z-index: 2;
}
.nav-mod-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 550;
  color: #475569;
  border-radius: 100px;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
  overflow: hidden;
}
.nav-mod-link-bg {
  position: absolute;
  inset: 0;
  border-radius: 100px;
  background: linear-gradient(135deg, var(--brand-light), color-mix(in srgb, var(--brand) 6%, transparent));
  transform: scaleX(0.7) scaleY(0.3);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nav-mod-link:hover .nav-mod-link-bg {
  transform: scaleX(1) scaleY(1);
  opacity: 1;
}
.nav-mod-link:hover {
  color: #0f172a;
  transform: translateY(-1px);
}
.nav-mod-link.active { color: var(--brand); }
.nav-mod-link.active .nav-mod-link-bg {
  background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 10%, transparent), color-mix(in srgb, var(--brand) 4%, transparent));
  transform: scaleX(1) scaleY(1);
  opacity: 1;
}
.nav-mod-link i {
  font-size: 13px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  z-index: 1;
}
.nav-mod-link span { position: relative; z-index: 1; }
.nav-mod-link:hover i { transform: translateY(-1px) scale(1.15); }

/* CTA */
.nav-mod-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 22px;
  height: 38px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
  background: linear-gradient(135deg, var(--brand), #8b5cf6, #ec4899);
  background-size: 200% 200%;
  animation: gradShift 4s ease infinite;
  box-shadow: 0 4px 20px color-mix(in srgb, var(--brand) 30%, transparent);
  z-index: 2;
}
@keyframes gradShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.nav-mod-cta::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%) rotate(5deg);
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-mod-cta:hover::before { transform: translateX(100%) rotate(5deg); }
.nav-mod-cta:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 32px color-mix(in srgb, var(--brand) 45%, transparent);
}
.nav-mod-cta:active { transform: translateY(0) scale(0.97); }
.nav-mod-cta i {
  font-size: 14px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nav-mod-cta:hover i { transform: translateX(3px) scale(1.1); }

/* Hamburger */
.nav-mod-hamburger {
  display: none;
  width: 38px; height: 38px;
  align-items: center; justify-content: center;
  border: none; background: transparent;
  cursor: pointer;
  border-radius: 100px;
  transition: all 0.3s;
  z-index: 2;
}
.nav-mod-hamburger:hover { background: rgba(0,0,0,0.04); }
.nav-mod-hamburger span,
.nav-mod-hamburger span::before,
.nav-mod-hamburger span::after {
  display: block;
  width: 16px; height: 2px;
  background: #0f172a;
  border-radius: 2px;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.nav-mod-hamburger span::before,
.nav-mod-hamburger span::after {
  content: '';
  position: absolute;
  left: 0;
}
.nav-mod-hamburger span::before { top: -5.5px; }
.nav-mod-hamburger span::after { top: 5.5px; }
.nav-mod-hamburger.open span { background: transparent; }
.nav-mod-hamburger.open span::before { top: 0; transform: rotate(45deg); }
.nav-mod-hamburger.open span::after { top: 0; transform: rotate(-45deg); }

/* Mobile Overlay */
.nav-mod-overlay {
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(40px) saturate(160%);
  -webkit-backdrop-filter: blur(40px) saturate(160%);
  opacity: 0;
  pointer-events: none;
  transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 32px;
}
.nav-mod-overlay.open { opacity: 1; pointer-events: auto; }
.nav-mod-overlay-item {
  opacity: 0;
  transform: translateY(30px) scale(0.9);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nav-mod-overlay.open .nav-mod-overlay-item { opacity: 1; transform: translateY(0) scale(1); }
.nav-mod-overlay-item:nth-child(1) { transition-delay: 0.05s; }
.nav-mod-overlay-item:nth-child(2) { transition-delay: 0.12s; }
.nav-mod-overlay-item:nth-child(3) { transition-delay: 0.19s; }
.nav-mod-overlay-item:nth-child(4) { transition-delay: 0.26s; }
.nav-mod-overlay-link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 28px;
  text-decoration: none;
  font-size: 24px;
  font-weight: 650;
  color: #0f172a;
  letter-spacing: -0.03em;
  border-radius: 100px;
  transition: all 0.3s;
  width: 100%;
  max-width: 340px;
}
.nav-mod-overlay-link:hover { background: rgba(0,0,0,0.03); }
.nav-mod-overlay-link i { font-size: 20px; background: linear-gradient(135deg, var(--brand), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; width: 28px; display: inline-flex; }
.nav-mod-overlay-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 36px;
  margin-top: 20px;
  text-decoration: none;
  font-size: 19px;
  font-weight: 700;
  color: #fff;
  border-radius: 100px;
  width: 100%;
  max-width: 340px;
  background: linear-gradient(135deg, var(--brand), #8b5cf6, #ec4899);
  background-size: 200% 200%;
  animation: gradShift 4s ease infinite;
  box-shadow: 0 8px 32px color-mix(in srgb, var(--brand) 35%, transparent);
}

@media (max-width: 768px) {
  .nav-mod-inner { height: 56px; margin: 8px 12px 0; border-radius: 18px; padding: 0 12px; }
  .nav-mod.scrolled .nav-mod-inner { height: 52px; padding: 0 10px; }
  .nav-mod-links { display: none; }
  .nav-mod-cta { display: none; }
  .nav-mod-hamburger { display: flex; }

}
@media (min-width: 769px) {
  .nav-mod-hamburger { display: none; }
  .nav-mod-overlay { display: none !important; }
}
</style>

<div class="nav-mod" id="navMod">
  <div class="nav-mod-inner">
    <div class="nav-mod-blob nav-mod-blob-1"></div>
    <div class="nav-mod-blob nav-mod-blob-2"></div>
    <div class="nav-mod-blob nav-mod-blob-3"></div>

    <a class="nav-mod-brand" href="{% url 'public-home' business.slug %}">
      {% if business.logo %}
        <img src="{{ business.logo.url }}" alt="{{ business.name }}" class="nav-mod-brand-logo">
      {% else %}
        <span class="nav-mod-brand-name">{{ business.name }}</span>
      {% endif %}
    </a>

    <ul class="nav-mod-links">
      <li>
        <a class="nav-mod-link" href="{% url 'public-home' business.slug %}">
          <span class="nav-mod-link-bg"></span>
          <i class="bi bi-house"></i><span>Bosh sahifa</span>
        </a>
      </li>
      <li>
        <a class="nav-mod-link" href="{% url 'public-home' business.slug %}#employees">
          <span class="nav-mod-link-bg"></span>
          <i class="bi bi-people"></i><span>Mutaxassislar</span>
        </a>
      </li>
      <li>
        <a class="nav-mod-link" href="{% url 'public-blog-list' business.slug %}">
          <span class="nav-mod-link-bg"></span>
          <i class="bi bi-journal"></i><span>Blog</span>
        </a>
      </li>
    </ul>

    <div style="display:flex;align-items:center;gap:4px;">
      <a class="nav-mod-cta" href="{% url 'public-booking-step1' business.slug %}">
        Band Qilish <i class="bi bi-arrow-right"></i>
      </a>
      <button class="nav-mod-hamburger" id="navModHamburger" aria-label="Menu">
        <span></span>
      </button>
    </div>
  </div>
</div>

<div class="nav-mod-overlay" id="navModOverlay">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:340px;">
    <a href="{% url 'public-home' business.slug %}" class="nav-mod-overlay-item nav-mod-overlay-link" onclick="closeModMenu()">
      <i class="bi bi-house"></i>Bosh sahifa
    </a>
    <a href="{% url 'public-home' business.slug %}#employees" class="nav-mod-overlay-item nav-mod-overlay-link" onclick="closeModMenu()">
      <i class="bi bi-people"></i>Mutaxassislar
    </a>
    <a href="{% url 'public-blog-list' business.slug %}" class="nav-mod-overlay-item nav-mod-overlay-link" onclick="closeModMenu()">
      <i class="bi bi-journal"></i>Blog
    </a>
    <a href="{% url 'public-booking-step1' business.slug %}" class="nav-mod-overlay-item nav-mod-overlay-cta" onclick="closeModMenu()">
      Band Qilish <i class="bi bi-arrow-right"></i>
    </a>
  </div>
</div>

<script>
(function(){
  var nav = document.getElementById('navMod');
  var inner = document.querySelector('.nav-mod-inner');
  var hamburger = document.getElementById('navModHamburger');
  var overlay = document.getElementById('navModOverlay');
  var ticking = false;
  var scrollStopTimer;

  function updateDarkMode() {
    var darkHero = document.querySelector('.bk-hero, .emp-header, .blog-hero, .blog-detail-header');
    var sy = window.scrollY;
    var navH = nav ? (nav.offsetHeight || 68) : 84;
    if (darkHero && sy < darkHero.offsetHeight - navH) {
      nav.classList.add('nav-dark');
    } else {
      nav.classList.remove('nav-dark');
    }
  }

  function updateScroll() {
    var sy = window.scrollY;
    if (sy > 80) {
      nav.classList.add('scrolled');
      nav.classList.add('hidden');
      clearTimeout(scrollStopTimer);
      scrollStopTimer = setTimeout(function() {
        if (window.scrollY > 80) { nav.classList.remove('hidden'); }
      }, 250);
    } else {
      nav.classList.remove('scrolled', 'hidden');
      clearTimeout(scrollStopTimer);
    }
    updateDarkMode();
    ticking = false;
  }

  updateDarkMode();

  window.addEventListener('scroll', function() {
    if (!ticking) { requestAnimationFrame(updateScroll); ticking = true; }
  }, { passive: true });
  updateScroll();

  function toggleModMenu() {
    var isOpen = overlay.classList.toggle('open');
    hamburger.classList.toggle('open');
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }
  function closeModMenu() {
    overlay.classList.remove('open');
    hamburger.classList.remove('open');
    document.body.style.overflow = '';
  }
  if (hamburger) { hamburger.addEventListener('click', toggleModMenu); }
  window.closeModMenu = closeModMenu;
})();
</script>
