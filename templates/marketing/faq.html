{% extends 'base_marketing.html' %}

{% block title %}{{ m.nav.faq }} - BookFlow{% endblock %}

{% block marketing_content %}
<section class="mkt-page-hero">
  <div class="mkt-container">
    <div class="mkt-section-head narrow reveal">
      <div class="mkt-eyebrow"><span></span> {{ m.faq.eyebrow }}</div>
      <h1>{{ m.faq.title }}</h1>
      <p>{{ m.faq.subtitle }}</p>
    </div>
  </div>
</section>

<section class="mkt-section">
  <div class="mkt-container narrow">
    <div class="mkt-faq">
      {% for question,answer in faqs %}
        <details class="reveal" {% if forloop.first %}open{% endif %}>
          <summary>{{ question }}</summary>
          <p>{{ answer }}</p>
        </details>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
