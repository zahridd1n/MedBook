{% extends 'base.html' %}
{% block title %}Parolni tiklash — BookFlow{% endblock %}
{% block body %}
<style>
  @keyframes drift {
    0%{transform:translate(0,0)scale(1)}
    50%{transform:translate(40px,-30px)scale(1.05)}
    100%{transform:translate(0,0)scale(1)}
  }
  .auth-wrap {
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;background:#0a0826;
  }
  .auth-wrap::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 600px 400px at 50% 30%,rgba(99,102,241,.3),transparent),
      radial-gradient(ellipse 400px 400px at 70% 70%,rgba(139,92,246,.2),transparent);}
  .auth-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;pointer-events:none;}
  .auth-orb--1{width:400px;height:400px;background:radial-gradient(circle,#818cf8,#6366f1);top:-100px;right:-60px;animation:drift 22s ease-in-out infinite;}
  .auth-orb--2{width:300px;height:300px;background:radial-gradient(circle,#a78bfa,#8b5cf6);bottom:-80px;left:-80px;animation:drift 26s ease-in-out infinite reverse;}
  .auth-grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:60px 60px;pointer-events:none;}
  .auth-card{position:relative;z-index:1;width:100%;max-width:440px;margin:1rem;}
  .auth-card-inner{background:rgba(18,18,40,.75);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:2.5rem;box-shadow:0 25px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);}
  .auth-logo{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-size:1.35rem;font-weight:700;color:#fff;}
  .auth-logo:hover{color:#c7d2fe}
  .auth-title{font-size:1.15rem;font-weight:700;color:#fff;margin:.75rem 0 .25rem;}
  .auth-subtitle{font-size:.8rem;color:rgba(255,255,255,.5);margin-bottom:1.5rem;line-height:1.5;}
  .auth-link{color:rgba(255,255,255,.5);font-size:.8rem;transition:color .15s;}
  .auth-link:hover{color:#c7d2fe}
  .auth-divider{border-color:rgba(255,255,255,.06);margin:1.5rem 0;}
  .auth-icon-wrap{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;background:rgba(129,140,248,.12);}
</style>
<div class="auth-wrap">
  <div class="auth-orb auth-orb--1"></div>
  <div class="auth-orb auth-orb--2"></div>
  <div class="auth-grid"></div>
  <div class="auth-card">
    <div class="auth-card-inner text-center">
      <div class="auth-icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <h5 class="auth-title">Email yuborildi</h5>
      <p class="auth-subtitle">Agar email bazamizda mavjud bo'lsa, sizga parolni tiklash havolasi yuborildi.</p>
      <hr class="auth-divider">
      <p class="auth-link mb-0">
        <a href="{% url 'accounts:login' %}" style="color:#818cf8;font-weight:600">Kirish sahifasiga qaytish</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
